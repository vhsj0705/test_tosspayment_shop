<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>주문서 | FITLOG</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <!-- 토스페이먼츠 결제 SDK v2 -->
  <script src="https://js.tosspayments.com/v2/standard"></script>
</head>
<body data-page="checkout">
  <div id="header"></div>

  <main class="inner checkout">
    <h1 class="checkout__title">주문서</h1>

    <div class="checkout__grid">
      <div>
        <section class="section">
          <h2 class="section__title">주문 상품 <small id="itemCount"></small></h2>
          <div id="orderItems"></div>
          <div class="order-notice" id="orderNotice" hidden></div>
        </section>

        <section class="section">
          <h2 class="section__title">주문자 · 배송 정보</h2>
          <form id="ordererForm" novalidate>
            <div class="form-row">
              <label for="name">이름<span class="req">*</span></label>
              <input class="input" id="name" name="name" autocomplete="name" placeholder="받는 분 이름" />
            </div>
            <div class="form-row">
              <label for="phone">휴대폰 번호<span class="req">*</span></label>
              <input class="input" id="phone" name="phone" inputmode="numeric" autocomplete="tel" placeholder="숫자만 입력 (예: 01012345678)" />
            </div>
            <div class="form-row">
              <label for="email">이메일</label>
              <input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="결제 결과를 받을 이메일" />
            </div>
            <div class="form-row">
              <label for="address">배송지<span class="req">*</span></label>
              <input class="input" id="address" name="address" autocomplete="street-address" placeholder="주소를 입력해 주세요" />
            </div>
            <div class="form-row">
              <label for="memo">배송 메모</label>
              <select class="input" id="memo" name="memo">
                <option>문 앞에 놓아주세요</option>
                <option>경비실에 맡겨주세요</option>
                <option>배송 전 연락 바랍니다</option>
              </select>
            </div>
          </form>
        </section>

        <section class="section">
          <h2 class="section__title">할인</h2>
          <div class="coupon-box">
            <label><input type="checkbox" id="coupon" /> 신규 회원 첫 구매 쿠폰 (상품 금액의 20%, 최대 10,000원)</label>
          </div>
        </section>

        <section class="section">
          <h2 class="section__title">결제 수단</h2>
          <div class="pay-widget">
            <div id="payment-method"><p class="widget-loading">결제 수단을 불러오는 중이에요…</p></div>
            <div id="agreement"></div>
          </div>
        </section>
      </div>

      <aside class="summary" aria-label="결제 금액">
        <h2 class="summary__title">결제 금액</h2>
        <div class="summary__row"><span>상품 금액</span><span id="sumOrigin">0원</span></div>
        <div class="summary__row minus"><span>상품 할인</span><span id="sumDiscount">0원</span></div>
        <div class="summary__row minus"><span>쿠폰 할인</span><span id="sumCoupon">0원</span></div>
        <div class="summary__row"><span>배송비</span><span id="sumShip">0원</span></div>
        <div class="summary__total"><span>총 결제 금액</span><b id="sumTotal">0원</b></div>
        <p class="summary__note">주문 내용을 확인했으며, 결제 진행에 동의합니다.</p>
        <button type="button" class="btn btn--toss btn--block" id="payBtn" disabled>결제하기</button>
        <p class="test-notice">토스페이먼츠 <b>테스트 키</b>로 연동되어 있어 실제 금액이 빠져나가지 않아요.</p>
      </aside>
    </div>
  </main>

  <div id="footer"></div>

  <script src="js/supabase.js"></script>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
