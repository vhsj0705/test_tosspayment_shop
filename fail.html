<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>결제 실패 | FITLOG</title>
  <meta name="description" content="FITLOG 결제가 실패했을 때 이유와 다시 결제하는 방법을 안내해요." />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="fail">
  <div id="header"></div>

  <main class="result">
    <div class="result__icon result__icon--fail">!</div>
    <h1 id="failTitle">결제에 실패했어요</h1>
    <p class="result__desc" id="failMsg"></p>
    <dl class="result__table">
      <div><dt>에러 코드</dt><dd id="failCode">-</dd></div>
      <div><dt>주문번호</dt><dd id="failOrder">-</dd></div>
    </dl>
    <div class="result__actions">
      <a href="#" class="btn btn--line" id="retryBtn">다시 결제하기</a>
      <a href="top.html" class="btn btn--black">쇼핑 계속하기</a>
    </div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
  <script src="js/supabase.js"></script>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const q = new URLSearchParams(location.search);
      const code = q.get("code");
      const pending = readJSON(localStorage, "fitlog-pending-order", null);

      if (code === "PAY_PROCESS_CANCELED") document.getElementById("failTitle").textContent = "결제를 취소했어요";
      document.getElementById("failMsg").textContent = q.get("message") || "결제 중 문제가 생겼어요.";
      document.getElementById("failCode").textContent = code || "-";
      document.getElementById("failOrder").textContent = q.get("orderId") || "-";
      document.getElementById("retryBtn").href = pending && pending.mode === "direct" ? "checkout.html?mode=direct" : "checkout.html";
    });
  </script>
</body>
</html>
