<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>상의 | FITLOG</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="top">
  <div id="header"></div>

  <main class="inner">
    <section class="page-head">
      <p class="breadcrumb"><span>홈</span><span>상의</span></p>
      <h1 class="page-title">상의<small>TOP</small></h1>
      <div class="sub-tabs" id="subTabs" role="tablist" aria-label="세부 카테고리"></div>

      <div class="promo">
        <a href="#" class="promo__card promo__card--a"><em>WEEKLY BEST</em><strong>이번 주 가장 많이 팔린<br>반소매 티셔츠</strong></a>
        <a href="#" class="promo__card promo__card--b"><em>단독 발매</em><strong>LAYERED 25FW<br>단독 최대 35%</strong></a>
        <a href="#" class="promo__card promo__card--c"><em>가을 준비</em><strong>니트 &amp; 스웨터<br>얼리 세일</strong></a>
      </div>
    </section>

    <section aria-label="상품 목록">
      <div class="toolbar">
        <p class="toolbar__count">총 <b id="productCount">0</b>개 상품</p>
        <div class="toolbar__right">
          <label class="filter-chip"><input type="checkbox" id="freeOnly" /> 무료배송</label>
          <label class="blind" for="sortSelect">정렬</label>
          <select class="sort-select" id="sortSelect">
            <option value="popular">인기순</option>
            <option value="low">낮은 가격순</option>
            <option value="high">높은 가격순</option>
            <option value="sale">할인율순</option>
            <option value="review">후기 많은순</option>
          </select>
        </div>
      </div>
      <ul class="product-grid" id="productGrid"></ul>
    </section>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
</body>
</html>
