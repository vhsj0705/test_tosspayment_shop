<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>로그인 | FITLOG</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="login">
  <div id="header"></div>

  <main class="result auth">
    <div class="auth__tabs" role="tablist">
      <button type="button" class="auth__tab is-active" data-mode="login" role="tab">로그인</button>
      <button type="button" class="auth__tab" data-mode="signup" role="tab">회원가입</button>
    </div>

    <form id="authForm" class="order-lookup__form" novalidate>
      <div class="form-row">
        <label for="email">이메일</label>
        <input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" />
      </div>
      <div class="form-row">
        <label for="password">비밀번호</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" placeholder="8자 이상" />
      </div>
      <div class="form-row" id="confirmRow" hidden>
        <label for="password2">비밀번호 확인</label>
        <input class="input" id="password2" name="password2" type="password" autocomplete="new-password" placeholder="한 번 더 입력" />
      </div>
      <button type="submit" class="btn btn--black btn--block" id="authBtn">로그인</button>
    </form>
    <p class="result__desc auth__msg" id="authMsg"></p>

    <div id="signedIn" hidden>
      <h1>로그인돼 있어요</h1>
      <p class="result__desc" id="signedInEmail"></p>
      <div class="result__actions" style="margin-top:32px">
        <button type="button" class="btn btn--line" id="logoutBtn">로그아웃</button>
        <a href="top.html" class="btn btn--black">쇼핑하러 가기</a>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script>
    /*
     * 이메일 로그인·회원가입 (Supabase Auth)
     * ?next=top.html 처럼 돌아갈 페이지를 주면 로그인 뒤 그 페이지로 돌아가요(같은 사이트의 .html만 허용).
     */
    document.addEventListener("DOMContentLoaded", async () => {
      const next = new URLSearchParams(location.search).get("next") || "";
      const nextUrl = /^[a-z]+\.html(\?[^\s]*)?$/.test(next) ? next : "top.html";
      const form = $("#authForm");
      const msg = $("#authMsg");
      let mode = "login";

      const showSignedIn = (user) => {
        form.hidden = true;
        $(".auth__tabs").hidden = true;
        msg.textContent = "";
        $("#signedIn").hidden = false;
        $("#signedInEmail").textContent = user.email;
      };

      const user = await authReady;
      if (user) showSignedIn(user);

      $$(".auth__tab").forEach((t) =>
        t.addEventListener("click", () => {
          mode = t.dataset.mode;
          $$(".auth__tab").forEach((x) => x.classList.toggle("is-active", x === t));
          $("#confirmRow").hidden = mode !== "signup";
          $("#password").autocomplete = mode === "signup" ? "new-password" : "current-password";
          $("#authBtn").textContent = mode === "signup" ? "가입하기" : "로그인";
          msg.textContent = "";
        })
      );

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = $("#email").value.trim();
        const password = $("#password").value;
        $$(".input").forEach((el) => el.classList.remove("is-error"));
        const bad = (el, text) => {
          el.classList.add("is-error");
          el.focus();
          toast(text);
        };
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return bad($("#email"), "이메일 형식을 확인해 주세요");
        if (password.length < 8) return bad($("#password"), "비밀번호는 8자 이상이에요");
        if (mode === "signup" && password !== $("#password2").value) return bad($("#password2"), "비밀번호가 서로 달라요");

        const btn = $("#authBtn");
        btn.disabled = true;
        msg.textContent = "";
        try {
          if (mode === "login") {
            const { error } = await sb.auth.signInWithPassword({ email, password });
            if (error) throw error;
            location.href = nextUrl;
            return;
          }
          const { data, error } = await sb.auth.signUp({
            email,
            password,
            options: { emailRedirectTo: new URL("login.html", location.href).href },
          });
          if (error) throw error;
          if (data.session) {
            location.href = nextUrl;
            return;
          }
          msg.textContent = `${email}로 확인 메일을 보냈어요. 메일의 링크를 누른 뒤 로그인해 주세요.`;
        } catch (err) {
          console.error(err);
          const text = String(err.message || "");
          msg.textContent = /Invalid login credentials/i.test(text)
            ? "이메일 또는 비밀번호가 맞지 않아요."
            : /Email not confirmed/i.test(text)
            ? "이메일 확인이 아직 안 됐어요. 받은 메일의 링크를 눌러 주세요."
            : /already registered/i.test(text)
            ? "이미 가입된 이메일이에요. 로그인해 주세요."
            : "처리하지 못했어요. 잠시 후 다시 시도해 주세요. (" + text + ")";
        } finally {
          btn.disabled = false;
        }
      });

      $("#logoutBtn").addEventListener("click", async () => {
        await sb.auth.signOut();
        location.reload();
      });
    });
  </script>
</body>
</html>
