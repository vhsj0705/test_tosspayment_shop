<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>신발 | FITLOG</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="shoes">
  <div id="header"></div>

  <main class="inner">
    <section class="page-head">
      <p class="breadcrumb"><span>홈</span><span>신발</span></p>
      <h1 class="page-title">신발<small>SHOES</small></h1>
      <div class="sub-tabs" id="subTabs" role="tablist" aria-label="세부 카테고리"></div>

      <div class="promo">
        <a href="#" class="promo__card promo__card--a"><em>RANKING</em><strong>실시간 인기<br>스니커즈 TOP 10</strong></a>
        <a href="#" class="promo__card promo__card--b"><em>RUN CLUB</em><strong>러닝화 기획전<br>최대 28% 할인</strong></a>
        <a href="#" class="promo__card promo__card--c"><em>F/W BOOTS</em><strong>워커 &amp; 첼시 부츠<br>신상 입고</strong></a>
      </div>
    </section>

    <section aria-label="상품 목록">
      <div class="toolbar">
        <p class="toolbar__count">총 <b id="productCount">0</b>개 상품</p>
        <div class="toolbar__right">
          <label class="filter-chip"><input type="checkbox" id="freeOnly" /> 무료배송</label>
          <label class="blind" for="sortSelect">정렬</label>
          <select class="sort-select" id="sortSelect">
            <option value="popular">인기순</option>
            <option value="low">낮은 가격순</option>
            <option value="high">높은 가격순</option>
            <option value="sale">할인율순</option>
            <option value="review">후기 많은순</option>
          </select>
        </div>
      </div>
      <ul class="product-grid" id="productGrid"></ul>
    </section>
  </main>

  <div id="footer"></div>

  <script src="js/supabase.js"></script>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
</body>
</html>
