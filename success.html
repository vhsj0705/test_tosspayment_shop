<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>결제 완료 | FITLOG</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="success">
  <div id="header"></div>

  <main class="result" id="result">
    <p class="widget-loading">결제 결과를 확인하는 중이에요…</p>
  </main>

  <div id="footer"></div>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script>
    /*
     * successUrl 처리
     * 1) 쿼리의 amount 가 결제 요청 전에 저장한 금액과 같은지 확인
     * 2) 서버로 paymentKey · orderId · amount 를 보내 '결제 승인 API'를 호출해야 결제가 최종 완료돼요.
     *    승인 API는 시크릿 키가 필요해서 브라우저에서 직접 호출하면 안 돼요.
     *    서버가 준비되면 아래 CONFIRM_ENDPOINT 에 주소를 넣으세요. (예: "/api/payments/confirm")
     */
    const CONFIRM_ENDPOINT = "";

    document.addEventListener("DOMContentLoaded", async () => {
      const q = new URLSearchParams(location.search);
      const paymentKey = q.get("paymentKey");
      const orderId = q.get("orderId");
      const amount = Number(q.get("amount"));
      const pending = readJSON(localStorage, "fitlog-pending-order", null);
      const box = document.getElementById("result");

      const fail = (title, desc) => {
        box.innerHTML = `
          <div class="result__icon result__icon--fail">!</div>
          <h1>${title}</h1>
          <p class="result__desc">${desc}</p>
          <div class="result__actions" style="margin-top:32px">
            <a href="checkout.html" class="btn btn--line">주문서로</a>
            <a href="top.html" class="btn btn--black">쇼핑 계속하기</a>
          </div>`;
      };

      if (!paymentKey || !orderId || !amount) return fail("잘못된 접근이에요", "결제 정보가 없어요.");
      if (!pending || pending.orderId !== orderId || pending.amount !== amount) {
        return fail("결제 금액이 일치하지 않아요", "요청한 주문 금액과 결제 금액이 달라 결제를 진행하지 않았어요.");
      }

      let approved = null;
      if (CONFIRM_ENDPOINT) {
        try {
          const res = await fetch(CONFIRM_ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ paymentKey, orderId, amount }),
          });
          const json = await res.json();
          if (!res.ok) return fail("결제 승인에 실패했어요", `${json.message || ""} (${json.code || res.status})`);
          approved = json;
        } catch (e) {
          return fail("결제 승인 중 오류가 났어요", e.message);
        }
      }

      // 주문 완료 처리
      if (pending.mode === "cart") Cart.clear();
      else sessionStorage.removeItem(DIRECT_KEY);
      localStorage.removeItem("fitlog-pending-order");

      const row = (k, v) => `<div><dt>${k}</dt><dd>${v}</dd></div>`;
      box.innerHTML = `
        <div class="result__icon result__icon--ok">✓</div>
        <h1>${approved ? "결제가 완료됐어요" : "결제 인증이 완료됐어요"}</h1>
        <p class="result__desc">${pending.orderer.name}님, 주문해 주셔서 감사해요.</p>
        <dl class="result__table">
          ${row("주문번호", orderId)}
          ${row("주문 상품", pending.orderName)}
          ${row("결제 금액", won(amount))}
          ${approved ? row("결제 수단", approved.method || "-") : ""}
          ${row("배송지", pending.orderer.address)}
          ${row("paymentKey", paymentKey)}
        </dl>
        ${approved ? "" : `<p class="test-notice" style="text-align:left;margin:-12px 0 24px">퍼블리싱 버전이라 <b>결제 승인 API</b>는 호출하지 않았어요. 서버에서 시크릿 키로 승인 API(POST /v1/payments/confirm)를 호출해야 결제가 최종 완료돼요.</p>`}
        <div class="result__actions">
          <a href="top.html" class="btn btn--line">쇼핑 계속하기</a>
          <a href="#" class="btn btn--black" onclick="return false">주문 내역 보기</a>
        </div>`;
    });
  </script>
</body>
</html>
