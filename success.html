<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>결제 완료 | FITLOG</title>
  <meta name="description" content="FITLOG 결제 승인 결과와 주문 상세를 보여 주는 페이지예요." />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="success">
  <div id="header"></div>

  <main class="result" id="result">
    <p class="widget-loading">결제를 승인하는 중이에요. 창을 닫지 말고 잠시만 기다려 주세요…</p>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
  <script src="js/supabase.js"></script>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script>
    /*
     * successUrl 처리
     * 쿼리의 paymentKey · orderId · amount 를 Supabase Edge Function(confirm-payment)으로 보내요.
     * 서버가 저장해 둔 주문 금액과 비교한 뒤, 시크릿 키로 토스 결제 승인 API를 호출하고 주문을 'paid'로 저장해요.
     */
    const row = (k, v) => `<div><dt>${k}</dt><dd>${v}</dd></div>`;

    document.addEventListener("DOMContentLoaded", async () => {
      const q = new URLSearchParams(location.search);
      const paymentKey = q.get("paymentKey");
      const orderId = q.get("orderId");
      const amount = Number(q.get("amount"));
      const pending = readJSON(localStorage, "fitlog-pending-order", null);
      const box = document.getElementById("result");

      const fail = (title, desc) => {
        box.innerHTML = `
          <div class="result__icon result__icon--fail">!</div>
          <h1>${esc(title)}</h1>
          <p class="result__desc">${esc(desc)}</p>
          <div class="result__actions" style="margin-top:32px">
            <a href="checkout.html" class="btn btn--line">주문서로</a>
            <a href="top.html" class="btn btn--black">쇼핑 계속하기</a>
          </div>`;
      };

      if (!paymentKey || !orderId || !amount) return fail("잘못된 접근이에요", "결제 정보가 없어요.");

      let order;
      try {
        order = await callFunction("confirm-payment", { paymentKey, orderId, amount });
      } catch (e) {
        return fail("결제 승인에 실패했어요", `${e.message} (${e.code})`);
      }

      // 주문 완료 처리: 장바구니 / 바로 구매 데이터 정리
      if (pending && pending.orderId === orderId) {
        if (pending.mode === "cart") Cart.clear();
        else sessionStorage.removeItem(DIRECT_KEY);
        localStorage.removeItem("fitlog-pending-order");
      }

      const name = pending && pending.orderId === orderId ? pending.orderer.name + "님, " : "";
      const a = order.amounts || {};
      // 주문 상세: 서버에 저장된 '주문 당시' 상품명·가격이에요.
      const itemRows = (order.items || [])
        .map((i) => row(`${esc(i.brand)} ${esc(i.name)}<br /><small>${esc(i.size)} / ${i.qty}개</small>`, won(i.lineTotal)))
        .join("");
      box.innerHTML = `
        <div class="result__icon result__icon--ok">✓</div>
        <h1>결제가 완료됐어요</h1>
        <p class="result__desc">${esc(name)}주문해 주셔서 감사해요.</p>
        <dl class="result__table">
          ${row("주문번호", esc(order.orderId))}
          ${itemRows || row("주문 상품", esc(order.orderName))}
          ${a.coupon ? row("쿠폰 할인", "-" + won(a.coupon)) : ""}
          ${row("배송비", a.shipping ? won(a.shipping) : "무료")}
          ${row("결제 금액", won(order.amount))}
          ${row("결제 수단", esc(order.method || "-"))}
          ${row("승인 시각", esc(order.approvedAt ? new Date(order.approvedAt).toLocaleString("ko-KR") : "-"))}
        </dl>
        ${order.warning ? `<p class="test-notice" style="text-align:left;margin:-12px 0 24px">${esc(order.warning)}</p>` : ""}
        <div class="result__actions">
          <a href="top.html" class="btn btn--line">쇼핑 계속하기</a>
          <a href="order.html?orderId=${encodeURIComponent(order.orderId)}" class="btn btn--black">주문 조회·취소</a>
        </div>
        <p class="test-notice" style="margin-top:16px">주문 조회·취소는 주문번호와 주문할 때 입력한 휴대폰 번호로 할 수 있어요.</p>`;
    });
  </script>
</body>
</html>
